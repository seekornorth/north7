# -- Site Configuration --
# Refer to the theme docs for more details about each of these parameters.
# https://nunocoracao.github.io/blowfish/docs/getting-started/

theme = "blowfish"
# PENTING (SEO): ganti dengan domain asli situs kamu, diakhiri garis miring.
# Tanpa ini, canonical, sitemap, dan OG URL tidak valid di Google.
baseURL = "https://example.com/"
defaultContentLanguage = "id"

enableRobotsTXT = true
[pagination]
  pagerSize = 20
summaryLength = 30

buildDrafts = false
buildFuture = false

enableEmoji = true

# googleAnalytics = "G-XXXXXXXXX"

[taxonomies]
  tag = "tags"
  category = "categories"

# URL artikel otomatis di root: /{slug}/ (tanpa /posts/ dan tanpa kategori)
[permalinks]
  posts = "/:slug/"
  # Slug taksonomi Bahasa Indonesia (frontmatter & logika tetap categories/tags)
  [permalinks.taxonomy]
    categories = "/kategori/"
    tags = "/topik/"
  [permalinks.term]
    categories = "/kategori/:slug/"
    tags = "/topik/:slug/"

[sitemap]
  changefreq = 'daily'
  filename = 'sitemap.xml'
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]

[related]
  includeNewer = true
  threshold = 80
  toLower = false
  [[related.indices]]
    applyFilter = false
    cardinalityThreshold = 0
    minTokenLength = 0
    name = 'keywords'
    pattern = ''
    toLower = false
    tokenize = false
    type = 'basic'
    weight = 100
  [[related.indices]]
    applyFilter = false
    cardinalityThreshold = 0
    minTokenLength = 0
    name = 'categories'
    pattern = ''
    toLower = false
    tokenize = false
    type = 'basic'
    weight = 90
  [[related.indices]]
    applyFilter = false
    cardinalityThreshold = 0
    minTokenLength = 0
    name = 'date'
    pattern = ''
    toLower = false
    tokenize = false
    type = 'basic'
    weight = 10
  [[related.indices]]
    applyFilter = false
    cardinalityThreshold = 0
    minTokenLength = 0
    name = 'tags'
    pattern = ''
    toLower = false
    tokenize = false
    type = 'basic'
    weight = 80